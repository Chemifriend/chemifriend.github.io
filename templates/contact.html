{% extends "base.html" %}
{% block content %}
<section class="section page-header">
  <div class="section-inner">
    <p class="section-eyebrow">Contact</p>
    <h1>문의하기</h1>
    <p class="page-lead">궁금하신 사항은 아래 연락처로 문의해 주세요.</p>
  </div>
</section>

<section class="section section-bg-light">
  <div class="section-inner">
    <div class="contact-strip">
      <div class="contact-info-block">
        <h3>{{ company.회사명 }}</h3>
        <p>{{ company.주소 }}<br>{{ company.영문주소 }}</p>
        <div class="contact-meta-list">
          <div class="contact-meta-item"><strong>Tel</strong>{{ company.전화 }}</div>
          <div class="contact-meta-item"><strong>Fax</strong>{{ company.팩스 }}</div>
        </div>
        <a class="btn-primary" style="margin-top:28px;" href="mailto:info@chemifriend.com">이메일로 문의하기 →</a>
      </div>
      <div class="location-map"><iframe src="{{ company.구글맵_임베드_URL }}" width="100%" height="280" style="border:0;" allowfullscreen loading="lazy"></iframe></div>
    </div>
  </div>
</section>
{% endblock %}
