{# 문의 폼 — static/form.js 가 전송. 필드 name 은 받은 메일에 그대로 항목명으로 표시됨 (email 은 회신 주소) #}
{% if lang == 'en' %}
<form class="inquiry" id="rfq"
  data-key="{{ company.문의폼_키 or '' }}" data-fallback="{{ inquiry_mail }}" data-from-name="Chemifriend website (EN)"
  data-subject="[RFQ] Website inquiry" data-name-field="Company"
  data-too-fast="Please take a moment to check your request and try again." data-sending="Sending…"
  data-ok="Thank you. Your request has been sent — we will reply by email." data-mail-app="Your email app has been opened with your request. Please press send."
  data-fail="The form could not be sent." data-fail-link="Send it by email instead →">
  <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="form-grid">
    <label>Company *<input name="Company" required></label>
    <label>Your name *<input name="Name" required></label>
    <label>Email *<input name="email" type="email" required></label>
    <label>Country<input name="Country"></label>
    <label class="span2">Product name / CAS No. *<input name="Product" required placeholder="e.g. Carbon black N330, CAS 1333-86-4"></label>
    <label>Specification / grade<input name="Specification"></label>
    <label>Quantity &amp; packaging<input name="Quantity" placeholder="e.g. 20 MT, 25 kg bags"></label>
    <label>Destination port / Incoterms<input name="Destination" placeholder="e.g. CIF Jebel Ali"></label>
    <label>Target delivery<input name="Target delivery" placeholder="e.g. December 2026"></label>
    <label class="span2">Message<textarea name="Message" rows="4" placeholder="Application, current supplier, any other details"></textarea></label>
  </div>
  <div class="form-foot">
    <button type="submit" class="btn-primary">Send request →</button>
    <p class="form-note">We use your information only to respond to your inquiry. Submissions are delivered to us via Web3Forms.</p>
  </div>
  <p class="form-msg" role="status"></p>
</form>
{% else %}
<form class="inquiry" id="form"
  data-key="{{ company.문의폼_키 or '' }}" data-fallback="{{ inquiry_mail }}" data-from-name="케미프렌드 홈페이지"
  data-subject="[홈페이지 문의]" data-name-field="회사명"
  data-too-fast="잠시 후 다시 눌러 주세요." data-sending="보내는 중…"
  data-ok="문의가 접수되었습니다. 담당자가 이메일로 연락드리겠습니다." data-mail-app="메일 앱에 문의 내용을 채워 두었습니다. 보내기를 눌러 주세요."
  data-fail="문의를 보내지 못했습니다." data-fail-link="이메일로 보내기 →">
  <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="form-grid">
    <label>회사명 *<input name="회사명" required></label>
    <label>이름 *<input name="이름" required></label>
    <label>이메일 *<input name="email" type="email" required></label>
    <label>연락처<input name="연락처" placeholder="회신 받을 전화번호 (선택)"></label>
    <label class="span2">관심 제품
      <select name="관심 제품">
        <option value="">선택 (선택사항)</option>
        {% for b in brands %}<option>{{ b.회사명 }}</option>{% endfor %}
        <option>기타 / 소싱 문의</option>
      </select></label>
    <label class="span2">문의 내용 *<textarea name="문의 내용" rows="5" required placeholder="품명·용도·필요 수량 등을 적어 주시면 빠르게 안내드립니다."></textarea></label>
  </div>
  <label class="agree"><input type="checkbox" name="_agree" required> (필수) 문의 응대를 위한 개인정보 수집·이용에 동의합니다. <span>수집 항목: 회사명·이름·이메일·연락처 / 목적: 문의 응대 / 보유: 문의 처리 후 파기(관계 법령상 보존 의무가 있는 경우 제외)<br>전송 대행: 입력하신 내용은 메일 전달을 위해 Web3Forms(Web3Creative, 인도)를 거쳐 담당자 이메일로 전달됩니다.</span></label>
  <div class="form-foot">
    <button type="submit" class="btn-primary">문의 보내기 →</button>
  </div>
  <p class="form-msg" role="status"></p>
</form>
{% endif %}
<script src="{{ base_path }}static/form.js" defer></script>
