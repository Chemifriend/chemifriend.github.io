<div class="brand-grid">
  {% for b in brands %}
  <a class="brand-card" href="{{ base_path }}product/{{ b.id }}/index.html">
    <div>
      <div class="brand-card-header">
        {% if b.로고 %}
        <img class="brand-card-logo" src="{{ base_path }}static/logos/{{ b.로고 }}" alt="{{ b.회사명 }}">
        {% else %}
        <span class="brand-card-wordmark">{{ b.회사명 }}</span>
        {% endif %}
        {% if b.국가 and b.설립연도 %}
        <span class="brand-card-badge">{{ b.국가 }} · {{ b.설립연도 }}</span>
        {% else %}
        <span class="brand-card-badge">Global Sourcing</span>
        {% endif %}
      </div>
      {% if b.영문슬로건 %}<p class="brand-card-slogan">"{{ b.영문슬로건 }}"</p>{% endif %}
      {% if b.요약 %}<p class="brand-card-summary">취급 제품: {{ b.요약 }}</p>{% endif %}
    </div>
    <span class="brand-card-cta">제품군 스펙 보기 →</span>
  </a>
  {% endfor %}
</div>
