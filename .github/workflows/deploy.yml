# main 브랜치에 push되면 클라우드(GitHub Actions)에서 build.py를 실행해 GitHub Pages에 배포한다.
# 로컬 PC에 Python이 없어도 사이트가 갱신된다. 결과물(docs/)은 저장소에 커밋하지 않는다.
# Actions 탭 → "Build & Deploy" → "Run workflow"로 수동 재배포도 가능.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
